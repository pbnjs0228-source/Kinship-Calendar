<script id="firestoreRules" type="text/plain">
rules_version = '2';
service cloud.firestore {
 match /databases/{database}/documents {
  function signed() { return request.auth != null; }
  function mine(uid) { return signed() && request.auth.uid == uid; }
  function member(fid) {
   return signed()
    && exists(/databases/$(database)/documents/families/$(fid)/members/$(request.auth.uid))
    && get(/databases/$(database)/documents/families/$(fid)/members/$(request.auth.uid)).data.status == 'active';
  }
  function adult(fid) {
   return member(fid) && get(/databases/$(database)/documents/families/$(fid)/members/$(request.auth.uid)).data.role == 'adult';
  }
  function date(v) { return v is string && v.matches('^[0-9]{4}-[0-9]{2}-[0-9]{2}$'); }
  function color(v) { return v is string && v.matches('^#[0-9a-fA-F]{6}$'); }
  function title(v,n) { return v is string && v.size() > 0 && v.size() <= n; }
  function validProfile(d) {
   return d.keys().hasOnly(['name','familyId','createdAt']) && title(d.name,50)
    && (d.familyId == null || d.familyId is string) && d.createdAt is timestamp;
  }
  function validFamily(d) {
   return d.keys().hasOnly(['name','ownerId','inviteCode','timezone','createdAt'])
    && title(d.name,60) && d.ownerId is string && d.inviteCode.matches('^[A-Z2-9]{12}$')
    && title(d.timezone,80) && d.createdAt is timestamp;
  }
  function validMember(d) {
   return d.keys().hasOnly(['name','color','role','status','requestedRole','joinedAt','joinCode'])
    && title(d.name,50) && color(d.color) && d.role in ['adult','child']
    && d.status in ['active','pending'] && d.requestedRole in ['adult','child']
    && d.joinCode is string && d.joinedAt is timestamp;
  }
  function invited(fid,code) {
   return code.matches('^[A-Z2-9]{12}$')
    && get(/databases/$(database)/documents/invites/$(code)).data.familyId == fid
    && get(/databases/$(database)/documents/families/$(fid)).data.inviteCode == code;
  }
  function ownOrAdult(fid) {
   return adult(fid) || (member(fid) && resource.data.createdBy == request.auth.uid);
  }
  function stableOwner() {
   return request.resource.data.createdBy == resource.data.createdBy
    && request.resource.data.createdAt == resource.data.createdAt;
  }
  function validEvent(d) {
   return d.keys().hasOnly(['title','category','startDate','endDate','startTime','endTime','allDay',
    'participants','location','description','recurrence','excludedDates','reminder','createdBy','createdAt','updatedAt'])
    && title(d.title,120) && d.category in ['Family','School','Work','Activities','Health','Other']
    && date(d.startDate) && date(d.endDate) && d.endDate >= d.startDate
    && d.startTime.matches('^([01][0-9]|2[0-3]):[0-5][0-9]$')
    && d.endTime.matches('^([01][0-9]|2[0-3]):[0-5][0-9]$')
    && d.allDay is bool && d.participants is list && d.participants.size() <= 50
    && d.location is string && d.location.size() <= 200
    && d.description is string && d.description.size() <= 3000
    && d.recurrence is map && d.recurrence.keys().hasOnly(['freq','interval','weekdays','until'])
    && d.recurrence.freq in ['none','daily','weekly','monthly','yearly']

async function saveRecord(collection,id,data){ensureWritable();const old=id?state[collection].find(x=>x.id===id):null;if(id&&!old)throw new Error('This item no longer exists.');if(old&&!canManage(old))throw new Error('You can only edit content you created.');const record={...data,updatedAt:state.demo?Date.now():fb.serverTimestamp()};if(!id){record.createdBy=state.user.uid;record.createdAt=state.demo?Date.now():fb.serverTimestamp()}if(state.demo){if(id){const idx=state[collection].findIndex(x=>x.id===id);state[collection][idx]={...old,...record,id}}else state[collection].push({...record,id:uid()});persistDemo();render();return}const ref=id?fb.doc(fb.db,'families',state.family.id,collection,id):fb.doc(fb.collection(fb.db,'families',state.family.id,collection));if(id)await fb.updateDoc(ref,record);else await fb.setDoc(ref,record)}

async function deleteRecord(collection,id){ensureWritable();const record=state[collection].find(x=>x.id===id);if(record&&!canManage(record))throw new Error('Only the creator or an adult can remove this.');if(state.demo){state[collection]=state[collection].filter(x=>x.id!==id);persistDemo();render();return}await fb.deleteDoc(fb.doc(fb.db,'families',state.family.id,collection,id))}

function skipEvent(id,date){const e=state.events.find(x=>x.id===id);if(!e||!canManage(e))return;confirmAction('Skip this date?','Only the occurrence beginning '+esc(fmtDate(date,{day:'numeric',month:'long'}))+' is skipped. The rest of the series stays on your calendar.',async()=>{await patchRecord('events',id,{excludedDates:[...new Set([...(e.excludedDates||[]),date])]});toast('This date has been skipped.');},'Skip this date')}
function clearCheckedItems(){if(!isAdult())return;confirmAction('A fresh little list?','Remove all checked items from the shared shopping list.',async()=>{const checked=state.items.filter(i=>i.checked);if(state.demo){state.items=state.items.filter(i=>!i.checked);persistDemo();render()}else{for(let n=0;n<checked.length;n+=400){const batch=fb.writeBatch(fb.db);checked.slice(n,n+400).forEach(i=>batch.delete(fb.doc(fb.db,'families',state.family.id,'items',i.id)));await batch.commit()}}toast('All checked items cleared.');},'Clear checked')}
function friendlyError(err){const messages={'auth/invalid-credential':'That email and password don’t match. Try again.','auth/invalid-email':'Enter a valid email address.','auth/email-already-in-use':'There’s already an account with this email. Try signing in.','auth/weak-password':'Choose a password with at least 8 characters.','auth/network-request-failed':'Could not connect. Check your internet connection.','auth/too-many-requests':'Too many attempts. Try again in a moment.','auth/operation-not-allowed':'Enable Email/Password in Firebase Authentication → Sign-in method.','auth/unauthorized-domain':'Add this website’s hostname in Firebase Authentication → Settings → Authorized domains.','permission-denied':'Firebase blocked this action. Check your family role and publish the Security rules from Firebase setup.','unavailable':'Firebase is unavailable. Check your connection and try again.','auth/invalid-api-key':'The Firebase API key is invalid. Check your web app configuration.'};return messages[err?.code]||err?.message||'Something didn’t go through. Please try again.'}
function getConfig(){const saved=readStore('kinship-firebase-config',null);return saved?.apiKey?saved:FIREBASE_CONFIG}
function hasConfig(){const c=getConfig();return Boolean(c.apiKey&&c.authDomain&&c.projectId&&c.appId)}
async function initFirebase(){if(fb)return fb;if(fbLoading)return fbLoading;if(!hasConfig())throw new Error('Add your Firebase web config in Settings → Firebase setup first.');
fbLoading=(async()=>{const root='https://www.gstatic.com/firebasejs/'+FIREBASE_SDK_VERSION+'/',[app,auth,fs]=await Promise.all([import(root+'firebase-app.js'),import(root+'firebase-auth.js'),import(root+'firebase-firestore.js')]);const instance=app.initializeApp(getConfig());fb={...auth,...fs,auth:auth.getAuth(instance),db:fs.getFirestore(instance)};authUnsubscribe=fb.onAuthStateChanged(fb.auth,user=>handleAuth(user).catch(err=>{setBusy(false);toast(friendlyError(err),'error')}));return fb})().catch(err=>{fbLoading=null;throw new Error('Firebase could not load. Check the config and allow www.gstatic.com on your network. '+(err.message||''))});return fbLoading}
function cleanupLive(){liveUnsubscribes.forEach(fn=>fn());liveUnsubscribes=[];if(membershipUnsubscribe){membershipUnsubscribe();membershipUnsubscribe=null}currentFamilyId=null;liveStarted=false}
function clearFamilyState(){state.ready=false;state.family=null;state.members=[];state.events=[];state.tasks=[];state.items=[];state.notes=[];state.selected='';state.cursor=null;state.search='';state.category='all';state.filters=new Set();$('#globalSearch').value='';render()}
async function handleAuth(user){const generation=++authGeneration;if(!user){setBusy(false);if(!state.demo)loadDemo();return}
setBusy(true,'Getting your family space ready…');cleanupLive();if(profileUnsubscribe)profileUnsubscribe();state.demo=false;state.user=user;clearFamilyState();const ref=fb.doc(fb.db,'users',user.uid),snap=await fb.getDoc(ref);if(generation!==authGeneration)return;if(!snap.exists())await fb.setDoc(ref,{name:signupName||user.displayName||'Family member',familyId:null,createdAt:fb.serverTimestamp()});if(generation!==authGeneration)return;closeModal();
profileUnsubscribe=fb.onSnapshot(ref,s=>{if(!s.exists()||generation!==authGeneration)return;state.profile=s.data();if(state.profile.familyId){if(currentFamilyId!==state.profile.familyId)connectFamily(state.profile.familyId)}else{cleanupLive();clearFamilyState();setBusy(false);onboarding()}},err=>{setBusy(false);toast(friendlyError(err),'error')})}
function connectFamily(fid){cleanupLive();currentFamilyId=fid;membershipUnsubscribe=fb.onSnapshot(fb.doc(fb.db,'families',fid,'members',state.user.uid),async s=>{if(currentFamilyId!==fid)return;
if(!s.exists()){liveUnsubscribes.forEach(fn=>fn());liveUnsubscribes=[];liveStarted=false;clearFamilyState();setBusy(false);if(state.profile?.familyId===fid){try{await fb.updateDoc(fb.doc(fb.db,'users',state.user.uid),{familyId:null});toast('You are no longer a member of that family.')}catch(err){toast(friendlyError(err),'error')}}return}
const me={id:s.id,...s.data()};if(me.status==='pending'){setBusy(false);state.members=[me];state.ready=false;render();waitingForApproval();return}if(!liveStarted){liveStarted=true;startFamilyStreams(fid)}},err=>{setBusy(false);toast(friendlyError(err),'error')})}
function startFamilyStreams(fid){const seen=new Set();let pending=6;state.filters=new Set(['everyone']);state.members=[];state.events=[];state.tasks=[];state.items=[];state.notes=[];
const complete=key=>{if(currentFamilyId!==fid)return;if(!seen.has(key)){seen.add(key);pending--}if(pending<=0){setBusy(false);state.ready=true;state.selected=state.selected||today();state.cursor=state.cursor||monthStart(parseDate(today()));if($('#modal').open&&['A little hello is on its way.','Make yourself at home.'].includes($('#modalTitle')?.textContent))closeModal();render()}};
const err=e=>{if(currentFamilyId===fid){setBusy(false);toast(friendlyError(e),'error')}};
liveUnsubscribes.push(fb.onSnapshot(fb.doc(fb.db,'families',fid),s=>{if(currentFamilyId!==fid)return;if(s.exists())state.family={id:s.id,...s.data()};complete('family')},err));
['members','events','tasks','items','notes'].forEach(name=>liveUnsubscribes.push(fb.onSnapshot(fb.collection(fb.db,'families',fid,name),snap=>{if(currentFamilyId!==fid)return;const previous=new Set(state.members.map(m=>m.id));state[name]=snap.docs.map(d=>({id:d.id,...d.data()}));if(name==='members')state.members.forEach(m=>{if(!previous.has(m.id)&&m.status==='active')state.filters.add(m.id)});complete(name)},err)))}
function authModal(mode='signin'){showModal('A place for your people.','Sign in or create an account to bring your family together.','<div class="auth-tabs"><button data-action="authTab" data-mode="signin" class="'+(mode==='signin'?'active':'')+'">Sign in</button><button data-action="authTab" data-mode="signup" class="'+(mode==='signup'?'active':'')+'">Create account</button></div>'+(!hasConfig()?'<div class="form-info">'+icon('cloud')+' First, connect your Firebase project. <button class="text-btn" data-action="setup" style="text-decoration:underline">Open Firebase setup</button></div>':'')+'<form>'+(mode==='signup'?field('Your name','<input class="input" name="name" autocomplete="name" placeholder="What should we call you?" maxlength="50" required autofocus>'):'')+field('Email address','<input class="input" type="email" name="email" autocomplete="email" placeholder="you@example.com" required '+(mode==='signin'?'autofocus':'')+'>')+field('Password','<input class="input" type="password" name="password" autocomplete="'+(mode==='signin'?'current-password':'new-password')+'" placeholder="'+(mode==='signin'?'Your password':'At least 8 characters')+'" '+(mode==='signup'?'minlength="8"':'')+' required>')+(mode==='signin'?'<button class="text-btn" type="button" data-action="resetPassword" style="font-size:10px;margin-bottom:20px">Forgot your password?</button>':'')+'<button class="btn primary wide" type="submit">'+(mode==='signin'?'Welcome back':'Create my account')+' '+icon('arrowRight')+'</button><p class="auth-bottom">'+(mode==='signup'?'You’ll choose your family and role in the next step.':'Your family’s everyday, waiting right here.')+'</p></form>',{
submit:async data=>{if(!hasConfig())throw new Error('Connect Firebase using the setup button above first.');await initFirebase();signupName=mode==='signup'?data.get('name').trim():'';if(mode==='signup'){if(!signupName)throw new Error('Enter your name.');const c=await fb.createUserWithEmailAndPassword(fb.auth,data.get('email').trim(),data.get('password'));await fb.updateProfile(c.user,{displayName:signupName})}else await fb.signInWithEmailAndPassword(fb.auth,data.get('email').trim(),data.get('password'));}})}
function onboarding(mode='join'){showModal('Make yourself at home.','Create your family space, or join one with a code.','<div class="auth-tabs"><button data-action="onboardingTab" data-mode="join" class="'+(mode==='join'?'active':'')+'">Join a family</button><button data-action="onboardingTab" data-mode="create" class="'+(mode==='create'?'active':'')+'">Create a family</button></div><form>'+field('Your name','<input class="input" name="name" value="'+esc(state.profile?.name||state.user.displayName||'')+'" maxlength="50" required>')+(mode==='join'?field('Family join code','<input class="input" name="code" placeholder="ABCD-EFGH-JKLM" autocomplete="off" spellcheck="false" maxlength="16" style="font-family:ui-monospace,monospace;letter-spacing:2px;text-transform:uppercase" required autofocus>')+field('I’m joining as','<select class="input" name="role"><option value="child">A child</option><option value="adult">An adult</option></select>')+'<div class="form-info">'+icon('shield')+' Joining as an adult sends an approval request to the adults already in the family.</div>':field('Your family name','<input class="input" name="familyName" maxlength="60" placeholder="The Bailey family" required autofocus>')+field('Family timezone','<select class="input" name="timezone">'+timezoneOptions(Intl.DateTimeFormat().resolvedOptions().timeZone)+'</select>')+'<div class="form-info">'+icon('shield')+' You’ll be the family owner with an adult account. Invite everyone else with your family’s code.</div>')+'<button class="btn primary wide" type="submit">'+(mode==='join'?'Join our family':'Create our family')+' '+icon('arrowRight')+'</button><p class="auth-bottom"><button class="text-btn" type="button" data-action="signout">Sign out</button></p></form>',{submit:async data=>{if(!navigator.onLine)throw new Error('Connect to the internet first.');const name=data.get('name').trim();if(!name)throw new Error('Enter your name.');if(mode==='create')await createFamily(data.get('familyName').trim(),name,data.get('timezone'));else await joinFamily(data.get('code'),data.get('role'),name);}})}
function timezoneOptions(current){let zones=[current,'Australia/Sydney','Australia/Melbourne','Australia/Brisbane','Australia/Perth','Australia/Adelaide','Pacific/Auckland','Europe/London','America/New_York','America/Los_Angeles','Asia/Singapore','Asia/Tokyo','UTC'];try{zones=[...new Set([current,...Intl.supportedValuesOf('timeZone'),'UTC'])]}catch{zones=[...new Set(zones)]}return selectOptions(zones,current)}
async function createFamily(name,memberName,timezone){if(!name)throw new Error('Give your family a name.');const id=uid(),code=generateCode(),batch=fb.writeBatch(fb.db),user=state.user;
batch.set(fb.doc(fb.db,'families',id),{name,ownerId:user.uid,inviteCode:code,timezone,createdAt:fb.serverTimestamp()});
batch.set(fb.doc(fb.db,'families',id,'members',user.uid),{name:memberName,color:colors[0],role:'adult',status:'active',requestedRole:'adult',joinedAt:fb.serverTimestamp(),joinCode:code});
batch.set(fb.doc(fb.db,'invites',code),{familyId:id,familyName:name});batch.update(fb.doc(fb.db,'users',user.uid),{name:memberName,familyId:id});
await batch.commit();if($('#modal').open&&$('#modalTitle')?.textContent==='Make yourself at home.')closeModal();toast('Your family has a new home.')}
async function joinFamily(raw,role,name){const code=String(raw).toUpperCase().replace(/[\s-]/g,'');if(!/^[A-Z2-9]{12}$/.test(code))throw new Error('Use the full 12-character family code.');const invite=await fb.getDoc(fb.doc(fb.db,'invites',code));if(!invite.exists())throw new Error('That code wasn’t found. Ask an adult for the current code.');const data=invite.data(),batch=fb.writeBatch(fb.db);state.family={id:data.familyId,name:data.familyName};
batch.set(fb.doc(fb.db,'families',data.familyId,'members',state.user.uid),{name,color:colors[2+Math.floor(Math.random()*6)],role:'child',requestedRole:role,status:role==='adult'?'pending':'active',joinCode:code,joinedAt:fb.serverTimestamp()});
batch.update(fb.doc(fb.db,'users',state.user.uid),{name,familyId:data.familyId});await batch.commit();if($('#modal').open&&$('#modalTitle')?.textContent==='Make yourself at home.')closeModal();}
function waitingForApproval(){showModal('A little hello is on its way.','An adult in '+esc(state.family?.name||'your family')+' needs to approve your adult access.','<div style="text-align:center;padding:15px 0 10px"><div style="font-size:40px;margin-bottom:12px">🌿</div><p class="text-muted" style="line-height:1.9">Ask an adult to open <strong>Our family</strong> and approve your request. This screen updates automatically when you’re approved.</p><div class="form-footer"><button class="btn" data-action="cancelJoin">Cancel request</button><button class="btn primary" data-action="signout">Sign out</button></div></div>')}
async function approveMember(id){if(!isAdult())return;ensureWritable();if(state.demo){const m=memberById(id);if(m){m.role='adult';m.status='active';persistDemo();render()}}else await fb.updateDoc(fb.doc(fb.db,'families',state.family.id,'members',id),{role:'adult',status:'active'});toast('Welcome to the grown-up team.')}
function manageMember(id){const m=memberById(id);if(!m||!isAdult()||id===state.family.ownerId)return;showModal('A little family admin.','Manage '+esc(m.name)+'’s access.','<div class="setting-row">'+avatar(m,'large')+'<span class="row-main"><strong>'+esc(m.name)+'</strong><small>'+esc(m.role==='adult'?'Adult':'Child')+' account</small></span></div><div class="form-footer"><button class="btn danger left" data-action="removeMember" data-id="'+esc(id)+'">'+icon('trash')+' Remove member</button><button class="btn primary" data-action="changeRole" data-id="'+esc(id)+'">'+icon('shield')+' Make '+(m.role==='adult'?'child':'adult')+'</button></div>')}
function changeMemberRole(id){if(!isAdult()||id===state.family.ownerId)return;const m=memberById(id);if(!m)return;const role=m.role==='adult'?'child':'adult';confirmAction('Change this role?','Give '+esc(m.name)+' '+role+' permissions in your family.',async()=>{ensureWritable();if(state.demo){m.role=role;persistDemo();render()}else await fb.updateDoc(fb.doc(fb.db,'families',state.family.id,'members',id),{role,status:'active'});toast('Family role updated.');},'Change role')}
async function rotateCode(removeUid=null){if(!isAdult())throw new Error('Only an adult can replace the code.');ensureWritable();const code=generateCode();if(state.demo){state.family.inviteCode=code;if(removeUid)state.members=state.members.filter(m=>m.id!==removeUid);persistDemo();render();return}const batch=fb.writeBatch(fb.db);batch.delete(fb.doc(fb.db,'invites',state.family.inviteCode));batch.set(fb.doc(fb.db,'invites',code),{familyId:state.family.id,familyName:state.family.name});batch.update(fb.doc(fb.db,'families',state.family.id),{inviteCode:code});if(removeUid)batch.delete(fb.doc(fb.db,'families',state.family.id,'members',removeUid));await batch.commit()}
function removeMember(id){const m=memberById(id);if(!m||!isAdult()||id===state.family.ownerId)return;confirmAction('Remove '+esc(firstName(m.name))+'?','They’ll lose access to this family. The join code is also replaced so the old code can’t be reused.',async()=>{await rotateCode(id);toast('Member removed and join code replaced.');},'Remove member',true)}
function profileModal(){if(!state.ready){onboarding();return}const me=currentMember();showModal('Make it feel like home.','Your preferences, account, and family settings.','<div class="setting-row">'+avatar(me,'large')+'<span class="row-main"><strong>'+esc(me?.name)+'</strong><small>'+(state.demo?'Local demo · changes stay on this device':esc(state.user.email||'')+' · '+(isAdult()?'Adult':'Child'))+'</small></span><button class="btn small" data-action="editProfile">Edit profile</button></div><div class="setting-row">'+icon('moon')+'<span class="row-main"><strong>A softer evening view</strong><small>Choose a look for this device.</small></span><select class="input" id="themeSelect" aria-label="Theme"><option value="light" '+(!document.body.classList.contains('dark')?'selected':'')+'>Light</option><option value="dark" '+(document.body.classList.contains('dark')?'selected':'')+'>Dark</option></select></div><div class="setting-row">'+icon('bell')+'<span class="row-main"><strong>Event reminders</strong><small>Browser alerts while Kinship stays open.</small></span><button class="btn small" data-action="enableNotifications">Enable alerts</button></div><div class="setting-row">'+icon('cloud')+'<span class="row-main"><strong>Firebase connection</strong><small>'+(hasConfig()?esc(getConfig().projectId):'Connect your project to sync everyone.')+'</small></span><button class="btn small" data-action="setup">Setup</button></div>'+(isAdult()?'<div class="setting-row">'+icon('home')+'<span class="row-main"><strong>'+esc(state.family.name)+'</strong><small>'+esc(state.family.timezone)+'</small></span><button class="btn small" data-action="editFamily">Edit family</button></div>':'')+'<div class="setting-row">'+icon('download')+'<span class="row-main"><strong>Your family calendar</strong><small>Export the next 12 months to .ics, or print.</small></span><button class="btn small" data-action="exportCalendar">Export</button><button class="btn small" data-action="print">Print</button></div><p class="meta-note">Times use your family’s timezone. Browser alerts need an open tab and notification permission. Background push notifications aren’t included.</p><div class="form-footer">'+(state.demo?'<button class="btn left" data-action="resetDemo">Reset demo</button><button class="btn primary" data-action="auth">Create an account</button>':'<button class="btn danger left" data-action="signout">'+icon('logout')+' Sign out</button>'+(state.user.uid!==state.family.ownerId?'<button class="btn" data-action="leaveFamily">Leave family</button>':'<span class="meta-note">Family owner</span>'))+'</div>')}
function editProfile(){const me=currentMember();showModal('Your little corner.','A name and a colour that feel like you.','<form>'+field('Your name','<input class="input" name="name" value="'+esc(me.name)+'" maxlength="50" required autofocus>')+'<div class="field"><span>Your calendar colour</span><div class="note-swatch">'+colors.map(c=>'<label><input type="radio" name="color" value="'+c+'" '+(c===me.color?'checked':'')+' aria-label="Colour '+c+'"><span style="--note-bg:'+c+'"></span></label>').join('')+'</div></div>'+formFooter('Save profile')+'</form>',{submit:async data=>{const name=data.get('name').trim();if(!name)throw new Error('Enter your name.');ensureWritable();if(state.demo){Object.assign(me,{name,color:data.get('color')});persistDemo();render()}else{const batch=fb.writeBatch(fb.db);batch.update(fb.doc(fb.db,'families',state.family.id,'members',state.user.uid),{name,color:data.get('color')});batch.update(fb.doc(fb.db,'users',state.user.uid),{name});await batch.commit();await fb.updateProfile(fb.auth.currentUser,{displayName:name})}closeModal();toast('A little more you.');}})}
function editFamily(){if(!isAdult())return;showModal('A home with a name.','Changing the timezone keeps event clock times the same.','<form>'+field('Family name','<input class="input" name="name" value="'+esc(state.family.name)+'" maxlength="60" required autofocus>')+field('Timezone','<select class="input" name="timezone">'+timezoneOptions(state.family.timezone)+'</select>')+formFooter('Save family')+'</form>',{submit:async data=>{const name=data.get('name').trim();if(!name)throw new Error('Give your family a name.');ensureWritable();if(state.demo){state.family.name=name;state.family.timezone=data.get('timezone');persistDemo();render()}else await fb.updateDoc(fb.doc(fb.db,'families',state.family.id),{name,timezone:data.get('timezone')});closeModal();toast('Your family settings are updated.');}})}
function parseConfig(text){let raw=text.trim();if(raw.includes('{'))raw=raw.slice(raw.indexOf('{'),raw.lastIndexOf('}')+1);let c;try{c=JSON.parse(raw)}catch{raw=raw.replace(/([{,]\s*)([A-Za-z_$][A-Za-z0-9_$]*)\s*:/g,'$1"$2":').replace(/'([^'\\]*(?:\\.[^'\\]*)*)'/g,(_,s)=>JSON.stringify(s.replace(/\\'/g,"'"))).replace(/,\s*}/g,'}');try{c=JSON.parse(raw)}catch{throw new Error('Paste the firebaseConfig object from your Firebase web app settings.')}}if(c.private_key||c.type==='service_account')throw new Error('Use the public web app config, never service-account credentials.');for(const k of ['apiKey','authDomain','projectId','appId'])if(typeof c[k]!=='string'||!c[k].trim())throw new Error('Your web config needs '+k+'.');const clean={};['apiKey','authDomain','projectId','appId','storageBucket','messagingSenderId','measurementId','databaseURL'].forEach(k=>{if(typeof c[k]==='string')clean[k]=c[k]});return clean}
function setupModal(tab='start'){const tabs='<div class="auth-tabs setup-tabs">'+[['start','Quick start'],['config','Firebase config'],['rules','Security rules'],['details','How it works']].map(([k,l])=>'<button data-action="setupTab" data-tab="'+k+'" class="'+(tab===k?'active':'')+'">'+l+'</button>').join('')+'</div>';let body;

else if(tab==='config')body='<form>'+field('Public Firebase web app configuration','<textarea class="input code-area" name="config" spellcheck="false" required placeholder=\'{ "apiKey": "...", "authDomain": "...", "projectId": "...", "appId": "..." }\'>'+esc(hasConfig()?JSON.stringify(getConfig(),null,2):'')+'</textarea>')+'<div class="form-info">'+icon('info')+' Accepts JSON or the firebaseConfig object copied from Firebase. This is public client configuration. Your Firestore rules protect the data.</div><p class="meta-note">Saving here connects this browser only. To distribute a ready-to-connect file, put the same config in FIREBASE_CONFIG in the source. Never include a service-account key.</p>'+formFooter('Save & connect')+'</form>';
else if(tab==='rules')body='<p class="meta-note">Firebase Console → Firestore Database → Rules. Replace the contents, then click Publish. These rules enforce family isolation and roles, including adult approval. Publish them before using real accounts.</p><div style="display:flex;justify-content:flex-end;margin:12px 0"><button class="btn soft small" data-action="copyRules">'+icon('copy')+' Copy all rules</button></div><textarea class="input code-area rules-area" readonly aria-label="Firestore security rules" spellcheck="false">'+esc($('#firestoreRules').textContent.trim())+'</textarea><p class="meta-note">Includes users, invitations, members, events, tasks, shopping items, and notes. No Cloud Functions or privileged client credentials are needed.</p>';
else body='<div class="form-info">'+icon('shield')+' Firebase Authentication handles accounts. Cloud Firestore stores your family and streams changes to everyone’s open app.</div><p class="meta-note"><strong>Adult access:</strong> the family creator is owner and adult. Children join immediately; adults need approval. Firestore rules check permissions on the server.</p><p class="meta-note"><strong>Calendar:</strong> daily, weekly, monthly and yearly repeats; intervals; end dates; chosen weekdays; multi-day events; skipped dates; series editing; family timezone; member filters; categories; search; .ics export; printing.</p><p class="meta-note"><strong>Everyday:</strong> assigned chores, priorities, due dates, shopping categories, live checklists, pinned notes, member colours, and dark mode.</p><p class="meta-note"><strong>Reminders:</strong> in-app and optional browser alerts while this page is open. Background push requires a separate service worker.</p><p class="meta-note"><strong>Demo:</strong> sample data stays in this browser. Real accounts use Firebase; live family data is never silently written into the demo. Live changes need internet access.</p><p class="meta-note"><strong>Export:</strong> .ics downloads contain individual occurrences for the next 12 months, including repeats and skipped dates. Timed events use UTC for import; all-day events keep their dates.</p><p class="meta-note"><strong>Deployment:</strong> one HTML file, with the Firebase SDK loaded from www.gstatic.com. Publish the supplied rules separately in Firebase Console. Give family members the same configured file or hosted app URL.</p><p class="meta-note"><strong>Before family use:</strong> test two accounts against your own project to confirm joining, adult approval, and sync. The demo is available immediately; no live Firebase project is preconfigured.</p>';
showModal('A little setup. A lot of together.','Everything you need to connect your Firebase project.',tabs+body,{large:true,submit:tab==='config'?async data=>{const c=parseConfig(data.get('config'));if(fb?.auth.currentUser)throw new Error('Sign out before changing Firebase projects.');if(writeStore('kinship-firebase-config',c)){toast('Configuration saved. Reloading to connect…');setTimeout(()=>location.reload(),600)}}:null})}
function reminderModal(){if(!state.ready)return;const now=Date.now(),events=[...new Map(occurrencesBetween(today(),addDays(parseDate(today()),1),false).map(e=>[e.instanceId,e])).values()].filter(e=>e.allDay||zonedEpoch(e.occurrenceDate,e.startTime,state.family.timezone)>=now);showModal('A little heads-up.','What’s coming up over the next two days.',events.length?events.slice(0,15).map(e=>'<button class="notification-row" data-action="event" data-id="'+esc(e.id)+'" data-date="'+e.occurrenceDate+'"><strong>'+esc(e.title)+'</strong><small>'+esc(fmtDate(e.occurrenceDate,{weekday:'short',day:'numeric',month:'short'}))+' · '+(e.allDay?'All day':timeLabel(e.startTime))+' · '+esc(namesFor(e))+'</small></button>').join(''):empty('bell','A little quiet ahead.','No upcoming plans for today or tomorrow.'))}
async function enableNotifications(){if(!('Notification'in window))return toast('This browser doesn’t support notifications. In-app reminders still work.','error');if(!window.isSecureContext)return toast('Browser alerts need HTTPS or localhost.','error');const result=await Notification.requestPermission();toast(result==='granted'?'Alerts enabled while Kinship is open.':'In-app reminders are still available.',result==='denied'?'error':'ok')}
function checkReminders(){if(!state.ready||!state.family)return;const now=Date.now(),events=[...new Map(occurrencesBetween(addDays(parseDate(today()),-1),addDays(parseDate(today()),2),false).map(e=>[e.instanceId,e])).values()];events.forEach(e=>{if(e.allDay||!e.reminder)return;if(e.participants?.length&&!e.participants.includes(state.user.uid))return;const start=zonedEpoch(e.occurrenceDate,e.startTime,state.family.timezone),due=start-e.reminder*60000,key=(state.demo?'demo':state.family.id)+'_'+e.instanceId+'_'+e.reminder;if(now>=due&&now<start&&now-due<90000&&!reminderSeen[key]){reminderSeen[key]=now;writeStore('kinship-reminders',reminderSeen);toast(e.title+' · '+timeLabel(e.startTime));if('Notification'in window&&Notification.permission==='granted')try{new Notification('A little plan is coming up',{body:e.title+' at '+timeLabel(e.startTime),tag:key})}catch{}}});Object.keys(reminderSeen).forEach(k=>{if(now-reminderSeen[k]>7*86400000)delete reminderSeen[k]})}
function icsEscape(s){return String(s||'').replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/;/g,'\\;').replace(/,/g,'\\,')}
function utcStamp(ms){return new Date(ms).toISOString().replace(/[-:]/g,'').replace(/\.[0-9]{3}/,'')}
function foldICS(line){let out='',current='',bytes=0;for(const c of line){const n=new TextEncoder().encode(c).length;if(bytes+n>73){out+=current+'\r\n ';current='';bytes=1}current+=c;bytes+=n}return out+current}
function calendarICS(){const start=parseDate(today()),end=addDays(start,365),events=[...new Map(occurrencesBetween(start,end,false).map(e=>[e.instanceId,e])).values()],lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Kinship//Family Calendar//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:'+icsEscape(state.family.name)];
events.forEach(e=>{lines.push('BEGIN:VEVENT','UID:'+e.instanceId+'@kinship.local','DTSTAMP:'+utcStamp(Date.now()));if(e.allDay)lines.push('DTSTART;VALUE=DATE:'+e.occurrenceDate.replace(/-/g,''),'DTEND;VALUE=DATE:'+dateStr(addDays(parseDate(e.endDate),1)).replace(/-/g,''));else lines.push('DTSTART:'+utcStamp(zonedEpoch(e.occurrenceDate,e.startTime,state.family.timezone)),'DTEND:'+utcStamp(zonedEpoch(e.endDate,e.endTime,state.family.timezone)));lines.push('SUMMARY:'+icsEscape(e.title),'LOCATION:'+icsEscape(e.location),'DESCRIPTION:'+icsEscape((e.description?e.description+'\n\n':'')+'Family: '+namesFor(e)),'END:VEVENT')});lines.push('END:VCALENDAR');return lines.map(foldICS).join('\r\n')+'\r\n'}
function exportCalendar(){if(!state.ready)return;const blob=new Blob([calendarICS()],{type:'text/calendar;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='kinship-family-calendar.ics';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('Your next 12 months, ready to import.')}
async function signout(){if(state.demo){authModal();return}if(fb)await fb.signOut(fb.auth);closeModal();loadDemo();toast('Signed out. Your family data stays with Firebase.')}
function leaveFamily(){if(state.user.uid===state.family.ownerId)return toast('The family owner can’t leave the family.','error');confirmAction('Leave this family?','Your account stays, but you’ll lose access to the family’s shared calendar and lists.',async()=>{ensureWritable();const fid=state.family.id,batch=fb.writeBatch(fb.db);batch.delete(fb.doc(fb.db,'families',fid,'members',state.user.uid));batch.update(fb.doc(fb.db,'users',state.user.uid),{familyId:null});await batch.commit();},'Leave family',true)}
async function cancelJoin(){if(!fb||!currentFamilyId)return;if(!navigator.onLine)throw new Error('Reconnect to cancel this request.');const batch=fb.writeBatch(fb.db);batch.delete(fb.doc(fb.db,'families',currentFamilyId,'members',state.user.uid));batch.update(fb.doc(fb.db,'users',state.user.uid),{familyId:null});await batch.commit()}
function searchModal(){showModal('Find a little something.','Search plans, lists, tasks, and notes.',field('Search your family space','<input class="input" id="modalSearch" placeholder="Football, milk, school..." value="'+esc(state.search)+'" autofocus>')+'<button class="btn primary wide" data-action="applySearch">Search</button>')}
function navigate(view){state.view=view;$('#sidebar').classList.remove('open');$('#mobileOverlay').classList.remove('show');render()}
async function handleAction(action,d,el){if(modalHandlers[action])return modalHandlers[action](d,el);switch(action){
case 'home':navigate('calendar');break;case 'view':navigate(d.view);break;case 'family':navigate('family');break;
case 'toggleSidebar':$('#sidebar').classList.toggle('open');$('#mobileOverlay').classList.toggle('show');break;
case 'closeSidebar':$('#sidebar').classList.remove('open');$('#mobileOverlay').classList.remove('show');break;
case 'closeModal':closeModal();break;case 'settings':profileModal();break;case 'theme':setTheme(document.body.classList.contains('dark')?'light':'dark');break;
case 'filterMember':if(state.filters.has(d.id))state.filters.delete(d.id);else state.filters.add(d.id);render();break;
case 'allMembers':state.filters=new Set([...activeMembers().map(m=>m.id),'everyone']);render();break;case 'onlyMine':state.filters=new Set([state.user.uid]);render();break;
case 'calendarMode':if(d.mode==='week'&&state.mode!=='week'&&state.selected&&parseDate(state.selected).getMonth()===state.cursor.getMonth()&&parseDate(state.selected).getFullYear()===state.cursor.getFullYear())state.cursor=parseDate(state.selected);state.mode=d.mode;renderContent();break;
case 'prev':case 'next':{const n=action==='prev'?-1:1;state.cursor=state.mode==='week'?addDays(state.cursor,n*7):new Date(state.cursor.getFullYear(),state.cursor.getMonth()+n,1,12);renderContent();break}
case 'today':state.selected=today();state.cursor=parseDate(today());renderContent();break;
case 'selectDay':state.selected=d.date;renderContent();break;case 'dayAgenda':dayAgenda(d.date);break;
case 'addEvent':eventForm('',d.date);break;case 'addFamilyEvent':eventForm('',state.selected);break;
case 'event':eventDetail(d.id,d.date);break;case 'editEvent':eventForm(d.id);break;case 'deleteEvent':confirmDelete('events',d.id,'this event and its entire series');break;case 'skipEvent':skipEvent(d.id,d.date);break;
case 'addTask':taskForm();break;case 'editTask':taskForm(d.id);break;case 'toggleTask':await toggleTask(d.id);break;case 'taskFilter':state.taskFilter=d.filter;renderContent();break;
case 'addItem':itemForm();break;case 'editItem':itemForm(d.id);break;case 'toggleItem':await toggleItem(d.id);break;case 'clearItems':clearCheckedItems();break;
case 'addNote':noteForm();break;case 'editNote':noteForm(d.id);break;case 'invite':inviteModal();break;case 'copyCode':await copyText(formatCode(state.family.inviteCode));break;
case 'rotateCode':confirmAction('A fresh family code?','The current code stops working. Existing family members keep their access.',async()=>{await rotateCode();toast('A fresh join code is ready to share.');},'Replace code');break;
case 'approveMember':await approveMember(d.id);break;case 'memberActions':manageMember(d.id);break;case 'changeRole':changeMemberRole(d.id);break;case 'removeMember':removeMember(d.id);break;
case 'editProfile':editProfile();break;case 'editFamily':editFamily();break;case 'auth':authModal();break;case 'authTab':authModal(d.mode);break;case 'onboardingTab':onboarding(d.mode);break;
case 'resumeJoin':currentMember()?.status==='pending'?waitingForApproval():onboarding();break;
case 'setup':setupModal();break;case 'setupTab':setupModal(d.tab);break;case 'copyRules':await copyText($('#firestoreRules').textContent.trim());break;
case 'signout':await signout();break;case 'leaveFamily':leaveFamily();break;case 'cancelJoin':await cancelJoin();break;case 'resetPassword':resetPassword();break;
case 'resetDemo':confirmAction('A fresh little start?','Reset the sample family and all local demo changes.',async()=>{loadDemo(true);persistDemo();toast('Demo reset.');},'Reset demo');break;
case 'notifications':reminderModal();break;case 'enableNotifications':await enableNotifications();break;case 'exportCalendar':exportCalendar();break;case 'print':closeModal();navigate('calendar');window.print();break;
case 'search':searchModal();break;case 'applySearch':state.search=$('#modalSearch').value;$('#globalSearch').value=state.search;closeModal();renderContent();break;
}}
function dayAgenda(ds){const events=occurrencesBetween(ds,ds);showModal(esc(fmtDate(ds,{weekday:'long',day:'numeric',month:'long'})),events.length+' plans for this little day.',(events.length?events.map(e=>'<button class="agenda-row" style="width:100%;margin-bottom:8px" data-action="event" data-id="'+esc(e.id)+'" data-date="'+e.occurrenceDate+'"><span class="member-dot" style="--member-color:'+eventColor(e)+'"></span><span class="event-text"><strong>'+esc(e.title)+'</strong><small>'+esc(namesFor(e))+'</small></span><time>'+(e.allDay?'All day':timeLabel(e.startTime))+'</time></button>').join(''):empty('sun','A little room to breathe.','There’s nothing planned for this day.'))+'<div class="form-footer"><button class="btn primary" data-action="addEvent" data-date="'+ds+'">'+icon('plus')+' Add a plan</button></div>')}
function resetPassword(){const previous=$('[name="email"]',$('#modal'))?.value||'';showModal('A little fresh start.','We’ll email you a link to reset your password.','<form>'+field('Your email','<input class="input" name="email" type="email" value="'+esc(previous)+'" required autofocus>')+formFooter('Send reset link')+'</form>',{submit:async data=>{await initFirebase();await fb.sendPasswordResetEmail(fb.auth,data.get('email').trim());closeModal();toast('If an account exists for that email, a reset link is on its way.');}})}
function setTheme(theme){document.body.classList.toggle('dark',theme==='dark');writeStore('kinship-theme',theme)}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;e.preventDefault();e.stopPropagation();Promise.resolve(handleAction(el.dataset.action,el.dataset,el)).catch(err=>toast(friendlyError(err),'error'))});
document.addEventListener('change',e=>{const id=e.target.id;if(id==='demoRole'){state.user.uid=e.target.value;render()}else if(id==='categoryFilter'){state.category=e.target.value;renderContent()}else if(id==='showChecked'){state.showChecked=e.target.checked;renderContent()}else if(id==='repeatFreq'){const v=e.target.value;$('#repeatOptions').hidden=v==='none';$('#weeklyOptions').hidden=v!=='weekly'}else if(id==='themeSelect')setTheme(e.target.value)});
document.addEventListener('submit',async e=>{if(e.target.id!=='quickShopping')return;e.preventDefault();const form=e.target,btn=$('button',form),text=new FormData(form).get('text').trim();if(!text)return;btn.disabled=true;try{await saveRecord('items','',{text,quantity:'',section:'Other',checked:false});if(form.isConnected)form.reset();toast('A little something added to the list.')}catch(err){toast(friendlyError(err),'error')}finally{if(btn.isConnected)btn.disabled=false}});
$('#globalSearch').addEventListener('input',e=>{state.search=e.target.value;clearTimeout(searchTimer);searchTimer=setTimeout(renderContent,180)});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();if(getComputedStyle($('.search-box')).display!=='none')$('#globalSearch').focus();else searchModal()}if(e.key==='Escape'){$('#sidebar').classList.remove('open');$('#mobileOverlay').classList.remove('show')}if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('day-cell')){e.preventDefault();state.selected=e.target.dataset.date;dayAgenda(state.selected)}});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal()}});
window.addEventListener('online',()=>{updateConnection();toast('Back online. A little more in sync.');checkReminders()});window.addEventListener('offline',()=>{updateConnection();if(!state.demo)toast('You’re offline. Reconnect to sync and save changes.','error')});
/* Initialization */
setTheme(readStore('kinship-theme','light'));hydrateIcons();loadDemo();setInterval(checkReminders,30000);setTimeout(checkReminders,2000);
if(hasConfig())initFirebase().catch(err=>toast(friendlyError(err),'error'));
</script></body></html>
